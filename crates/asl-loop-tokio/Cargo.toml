[package]
name = "asl-loop-tokio"
description = "La boucle d'entrées-sorties : sockets, horloge, et rien qui décide."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
asl-annuaire.workspace = true
asl-auth.workspace = true
asl-cle.workspace = true
asl-id.workspace = true
asl-proto.workspace = true
asl-registre.workspace = true
asl-session.workspace = true
asl-store.workspace = true
ams-proto-http.workspace = true

# La pile QUIC et HTTP/3 d'`air-mail-server` (C15). Voir le manifeste du
# workspace pour ce qui est repris et ce qui ne l'est pas.
ams-h3.workspace = true
ams-proto-quic.workspace = true
ams-quic.workspace = true
ams-quic-tls.workspace = true

# `ams-tls` EST UNE VRAIE DÉPENDANCE, ET NON UNE DÉPENDANCE D'ESSAI. Elle
# monte la configuration TLS, et surtout elle porte l'ALPN `h3` : voir
# `configuration_tls`, qui existe pour qu'on ne puisse pas l'oublier.
ams-tls.workspace = true

# `libc` POUR UN SEUL APPEL : `geteuid`, qui n'a pas d'équivalent dans `std`.
# Elle est DÉJÀ dans le graphe — `redb` la tire — et `check-sans-c.sh` l'admet
# avec sa raison écrite : ce sont des déclarations d'ABI, pas une ligne de C.
libc.workspace = true
rustls.workspace = true
tokio.workspace = true

[dev-dependencies]
# LE HARNAIS D'ESSAI D'`air-mail-server`, ET ICI C'EST SA PLACE EXACTE.
#
# Cette crate n'est pas une bibliothèque cliente — c'est le constat de la tranche
# précédente, et c'est pour cela qu'elle n'est pas dans `[dependencies]`. Mais
# **c'est un vrai client QUIC**, qui parle sur une vraie socket : rien d'autre ne
# peut éprouver cette boucle de bout en bout.
ams-quic-client.workspace = true
asl-cle.workspace = true

# Pour DÉCODER la réponse plutôt que d'y chercher des octets : `cache-control:
# no-store` est une entrée de la table statique de QPACK, et ne voyage donc pas
# en clair sur le fil.
ams-proto-h3.workspace = true
asl-id.workspace = true
asl-registre.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
