[package]
name = "asl-server"
description = "Le binaire de l'annuaire : il assemble, il ne décide de rien."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "asl-server"
path = "src/main.rs"

[dependencies]
asl-apple.workspace = true
asl-auth.workspace = true
asl-cle.workspace = true
# `asl-id` POUR L'IDENTIFIANT SOUS LEQUEL LA RACINE ESTAMPILLE — provisoire,
# seize zéros, tant que `--identity-key` n'existe pas (voir `main.rs`).
asl-id.workspace = true
asl-loop-tokio.workspace = true
asl-proto.workspace = true
asl-store.workspace = true

libc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
# Le harnais d'essai d'`air-mail-server` : un vrai client QUIC sur une vraie
# socket. Voir `docs/transport.md` §3 pour ce qu'il est et ce qu'il n'est pas.
ams-quic-client.workspace = true
# Pour DÉCODER les réponses — le statut est une entrée de la table statique de
# QPACK, il ne voyage pas en clair — et découper les trames `DATA` d'un flux
# tenu, celui de la voie entre racines.
ams-proto-h3.workspace = true
asl-registre.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
