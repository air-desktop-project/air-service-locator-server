#!/usr/sbin/nft -f
#
# La table du pare-feu d'un annuaire.
#
# ── ELLE N'EST PAS CHARGÉE PAR LE PAQUET, ET C'EST DÉLIBÉRÉ ─────────────────
#
# Un paquet qui poserait un pare-feu déciderait de ce qui entre sur une machine
# qu'il ne connaît pas — et la première chose qu'il fermerait, c'est la porte par
# laquelle on vient le corriger. **Relisez-la, adaptez-la, puis chargez-la
# vous-même** :
#
#     sudo nft -f /usr/share/doc/asl-server/nftables-asl.conf
#
# Pour qu'elle survive au redémarrage :
#
#     sudo install -m 0644 /usr/share/doc/asl-server/nftables-asl.conf \
#         /etc/nftables.conf
#     sudo systemctl enable --now nftables
#
# ── CHARGEZ-LA AVEC UN FILET ────────────────────────────────────────────────
#
# Une table qui ferme le 22 est une machine perdue. Posez un retour en arrière
# AVANT de charger, et annulez-le une fois qu'une NOUVELLE connexion ssh est
# passée — l'ancienne, elle, survit par `ct state established` et ne prouve rien :
#
#     sudo systemd-run --on-active=300 --unit=asl-repli nft delete table inet asl
#     sudo nft -f nftables-asl.conf
#     ssh …                                    # depuis une AUTRE session
#     sudo systemctl stop asl-repli.timer
#
# ── ELLE EST IDEMPOTENTE, ET ELLE NE VIDE PAS LE RESTE ──────────────────────
#
# Les deux premières lignes créent la table si elle manque, puis la suppriment :
# c'est l'idiome qui rend le fichier rechargeable sans `flush ruleset`, lequel
# emporterait les tables de tout le monde — docker, libvirt, un autre service.

table inet asl {}
delete table inet asl

table inet asl {
    chain entree {
        type filter hook input priority filter; policy drop;

        # **CE QUI RÉPOND À CE QU'ON A DEMANDÉ**, en premier : c'est la règle qui
        # voit le plus de paquets, et une chaîne se lit de haut en bas.
        ct state established,related accept
        ct state invalid drop

        # La boucle locale. `systemd-resolved` et `chrony` n'écoutent que là.
        iif lo accept

        # ── ICMPv6 EST OBLIGATOIRE, ET LE BLOQUER CASSE IPv6 ────────────────
        #
        # Ce n'est pas de la commodité : la découverte de voisins REMPLACE ARP,
        # et « paquet trop gros » est le seul moyen qu'a le réseau de dire qu'il
        # faut fragmenter. Une machine qui jette l'ICMPv6 perd ses voisins et
        # voit ses grosses réponses disparaître sans trace — le trou noir de MTU.
        icmpv6 type {
            destination-unreachable, packet-too-big, time-exceeded,
            parameter-problem, echo-request, echo-reply,
            nd-router-solicit, nd-router-advert,
            nd-neighbor-solicit, nd-neighbor-advert
        } accept

        # En IPv4, la fragmentation est moins vitale, mais « fragmentation
        # nécessaire » y joue le même rôle, et `echo-request` est ce qui permet
        # de constater qu'une machine est là.
        icmp type {
            destination-unreachable, echo-request, echo-reply,
            time-exceeded, parameter-problem
        } accept

        # ── LA PORTE PAR LAQUELLE ON RÉPARE ─────────────────────────────────
        #
        # **EN PREMIER PARMI LES SERVICES**, et sans condition : si une seule
        # règle doit survivre à une relecture distraite, c'est celle-là.
        tcp dport 22 accept

        # L'annuaire. QUIC, donc UDP, et rien d'autre.
        udp dport 6630 accept

        # ── HTTP ET HTTPS ───────────────────────────────────────────────────
        #
        # `nginx` tourne sur nitrogen. Sur argon, rien n'écoute là — et un port
        # ouvert sans service derrière n'est pas une porte, c'est un refus : le
        # noyau rend `connection refused` exactement comme aujourd'hui.
        #
        # Une seule table pour les deux machines, donc. Deux fichiers qui
        # disent presque la même chose finissent par ne plus la dire.
        tcp dport { 80, 443 } accept

        # Le client DHCP d'argon reçoit son bail sur le 68. La réponse ne suit
        # pas toujours le suivi de connexion — elle peut venir en diffusion,
        # d'une adresse que la requête ne nommait pas.
        udp dport 68 accept
    }

    # **ON NE ROUTE RIEN.** Ce n'est pas un routeur, et le dire dans la table
    # vaut mieux que de s'en remettre au réglage `net.ipv4.ip_forward`, qu'un
    # paquet installé plus tard pourrait remettre à un.
    chain suivi {
        type filter hook forward priority filter; policy drop;
    }

    # **LA SORTIE RESTE OUVERTE.** Filtrer ce qui part d'une machine qu'on
    # administre soi-même coûte des heures de diagnostic pour une gêne qu'un
    # attaquant déjà root contourne d'un `LD_PRELOAD`.
    chain sortie {
        type filter hook output priority filter; policy accept;
    }
}
