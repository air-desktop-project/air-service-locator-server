# Manifeste du workspace air-service-locator-server.
#
# Un ANNUAIRE DE SERVICES : des daemons annoncent le port sur lequel ils
# écoutent, et leurs clients retrouvent ce port sans qu'il ait jamais été fixé
# d'avance. Tous les paquets vivent sous `crates/`.
#
# LE DÉCOUPAGE EST CELUI D'`air-mail-server`, ET POUR LA MÊME RAISON : ce qui
# décide ne doit pas savoir lire une socket. Trois étages, et la frontière entre
# le deuxième et le troisième est la seule qui compte.
#
#   1. GRAMMAIRES   `asl-id`, `asl-proto`, `asl-api` — des octets vers des
#                   messages, et retour. Aucune socket, aucun fichier, aucune
#                   horloge.
#   2. DÉCISIONS    `asl-annuaire`, `asl-auth` — des machines à états. Elles
#                   reçoivent des messages et l'heure ; elles rendent des
#                   réponses et des ACTIONS. Elles n'attendent jamais.
#   3. EXÉCUTION    `asl-loop-tokio`, `asl-store` — les seules crates qui lisent,
#                   écrivent et attendent. Elles ne décident de rien.
#
# CE DÉCOUPAGE N'EST PAS DE L'ÉLÉGANCE, IL PAIE DEUX CHOSES ICI :
#
#   — L'EXPIRATION D'UN BAIL. « Ce daemon est-il encore en ligne ? » est une
#     question d'horloge. Si l'horloge est un appel système au fond d'une boucle,
#     il faut attendre une minute pour éprouver une expiration ; si c'est un
#     paramètre de l'étage 2, l'essai la pilote en trois lignes.
#   — LE CLIENT EMBARQUÉ. `asl-client` vit dans `air-service-locator-client` et
#     tire d'ici `asl-id` et `asl-proto`, et RIEN D'AUTRE. Tout ce que le client
#     partage avec le serveur doit être de l'étage 1, sinon un daemon qui
#     s'annonce tirerait la base de données de l'annuaire. La frontière de dépôt
#     rend cette règle littérale : ce qui n'est pas à l'étage 1 est hors de
#     portée, et non plus seulement déconseillé.
#
# Les étages 1 et 2 visent le 100 % de couverture : une machine à états se pilote
# pas à pas depuis un essai, une boucle asynchrone ne se pilote pas — on l'attend.
# L'étage 3 en est hors, non par indulgence, mais parce qu'y atteindre 100 %
# exigerait de simuler des pannes du noyau, ce qui mesure la simulation.
#
# LES CRATES SONT AUJOURD'HUI DES COQUILLES. Elles portent leur intention et rien
# d'autre : les spécifications ne sont pas écrites (`docs/`), et poser du code
# avant elles affirmerait des décisions que personne n'a prises.

[workspace]
resolver = "3"
members = [
    # Étage 1 — grammaires, sans entrée-sortie
    "crates/asl-id",
    "crates/asl-proto",
    "crates/asl-api",
    "crates/asl-registre",
    "crates/asl-attest",
    "crates/asl-jwt",
    # Étage 2 — décisions, sans entrée-sortie
    "crates/asl-annuaire",
    "crates/asl-auth",
    "crates/asl-cle",
    "crates/asl-apple",
    "crates/asl-session",
    # Étage 3 — exécution
    "crates/asl-store",
    "crates/asl-loop-tokio",
    # Binaire
    "crates/asl-server",
]

# `fuzz/` est une crate cargo-fuzz HORS de ce workspace, et les trois raisons
# sont en tête de `fuzz/Cargo.toml` — AUCUNE n'est celle d'`air-mail-server`,
# dont la séparation vient d'un conflit de toolchain qui n'existe pas ici.
#
# En deux mots : `libfuzzer-sys` et `arbitrary` n'ont rien à faire dans le lock
# du produit, que `check-pile.sh` inspecte et que `check-couverture.sh` mesure ;
# les drapeaux du sanitizer n'ont rien à faire dans la vérification ordinaire ;
# et rien de ce qui est tiré là-bas n'est livré.
#
# Elle a donc son propre `Cargo.lock`. Lancement : `scripts/check-fuzz.sh`.
exclude = ["fuzz"]

# `asl-client` A QUITTÉ CE DÉPÔT pour `air-service-locator-client`.
#
# Ce n'est pas un rangement : cette bibliothèque est un PRODUIT à part. Elle est
# liée par des daemons tiers, elle porte des liaisons Python, Ruby, C++, Kotlin
# et Swift, et un utilitaire en ligne de commande. Son rythme de publication,
# ses contraintes d'ABI (C12) et son public n'ont rien de commun avec ceux d'un
# serveur qu'on déploie sur ses propres machines.
#
# `asl-id` et `asl-proto` restent ICI et le dépôt client les tire par une
# dépendance `git` épinglée : ce dépôt porte les spécifications, donc il porte
# la grammaire qu'elles décrivent.

[workspace.package]
# Version en LOCKSTEP : toutes les crates la partagent via `version.workspace`.
# Un seul numéro à incrémenter, donc aucune dérive possible entre les paquets.
version = "0.1.0"
edition = "2024"
# PAS DE `rust-version`, ET C'EST DÉLIBÉRÉ.
#
# Ce champ déclare une version MINIMALE, ce qui n'a de sens que si l'on accepte
# d'être compilé par plusieurs toolchains. Ici `rust-toolchain.toml` en épingle
# UNE, datée, celle d'Air : il n'y a pas d'intervalle à déclarer, et un
# `rust-version` en inventerait un que personne ne vérifie.
#
# Il redeviendra utile le jour où ces crates seront publiées sur crates.io — un
# consommateur, lui, a bien une toolchain à lui.
license = "MPL-2.0"
authors = ["air-service-locator contributors"]
repository = "https://github.com/air-desktop-project/air-service-locator-server"

[workspace.dependencies]
# Les arêtes INTERNES ne se déclarent qu'à mesure qu'elles servent : une
# dépendance posée d'avance affirmerait un assemblage qui n'existe pas. Les neuf
# crates sont donc listées, mais AUCUNE ne dépend encore d'une autre.
asl-annuaire = { path = "crates/asl-annuaire", version = "0.1.0" }
asl-api = { path = "crates/asl-api", version = "0.1.0" }
asl-apple = { path = "crates/asl-apple", version = "0.1.0" }
asl-attest = { path = "crates/asl-attest", version = "0.1.0" }
asl-jwt = { path = "crates/asl-jwt", version = "0.1.0" }
asl-auth = { path = "crates/asl-auth", version = "0.1.0" }
asl-cle = { path = "crates/asl-cle", version = "0.1.0" }
asl-id = { path = "crates/asl-id", version = "0.1.0" }
asl-loop-tokio = { path = "crates/asl-loop-tokio", version = "0.1.0" }
asl-proto = { path = "crates/asl-proto", version = "0.1.0" }
asl-registre = { path = "crates/asl-registre", version = "0.1.0" }
asl-server = { path = "crates/asl-server", version = "0.1.0" }
asl-session = { path = "crates/asl-session", version = "0.1.0" }
asl-store = { path = "crates/asl-store", version = "0.1.0" }

# LES DÉPENDANCES EXTERNES n'entrent qu'au moment où une crate les consomme. Le
# graphe est donc VIDE aujourd'hui, et cette section restera vide tant que rien
# n'aura été écrit qui en ait besoin.
#
# ── CE QUI Y ENTRERA, ET QUI EST DÉJÀ DÉCIDÉ (contrainte C15) ──────────────
#
# La pile QUIC et HTTP/3 d'`air-mail-server` : `ams-quic`, `ams-quic-crypto`,
# `ams-quic-tls`, `ams-proto-quic`, `ams-proto-h3`, `ams-h3`, `ams-quic-client`.
# Elles ne sont PAS déclarées ici, et c'est la règle ci-dessus qui l'exige :
# aucune crate ne les consomme encore, et une dépendance posée d'avance
# affirmerait un assemblage qui n'existe pas.
#
# **Elles ont vocation à migrer dans `air`.** Elles seront donc tirées par une
# dépendance `git` ÉPINGLÉE vers `air-mail-server` dans un premier temps, puis
# vers `air`. Épinglée, parce qu'une dépendance `git` échappe à `cargo audit` et
# qu'un amont qui bouge sans prévenir casserait la vérification ; datée dans son
# commentaire, pour qu'on sache quand la revoir.
#
# **Aucune crate tierce de QUIC ou de HTTP/3 n'entrera jamais** — ni un module
# local qui en réimplémenterait une partie. Réimplémenter QUIC est le genre de
# décision qui paraît raisonnable un après-midi et coûte deux ans.
#
# ── LA PREMIÈRE DÉPENDANCE EXTERNE, ET POURQUOI CELLE-LÀ ───────────────────
#
# `ed25519-dalek` — les signatures des clés de machine (C14). Elle entre au
# moment où `asl-cle` la consomme, et pas avant.
#
# **PURE RUST, AUCUNE LIGNE DE C.** C'est la condition qui l'a fait retenir :
# `asl-client` l'embarquera, et il est chargé dans des interpréteurs Python et
# Ruby où une bibliothèque qui lierait sa propre libcrypto entrerait en conflit
# avec celle du processus hôte.
#
# `default-features = false` N'EST PAS UNE PRÉFÉRENCE DE STYLE : la feature
# `std` est dans les défauts, et ces crates sont `no_std`. La laisser active
# ferait entrer `std` par la porte de derrière, sans qu'aucune ligne de notre
# code ne le demande.
#
# `subtle` A ÉTÉ DÉCLARÉE ICI, PUIS RETIRÉE, ET LA RAISON MÉRITE D'ÊTRE ÉCRITE.
#
# Elle servait à `asl-auth`, qui comparait un code d'enrôlement présenté au code
# attendu, en temps constant — C9. **Il n'y a plus de code attendu** : l'annuaire
# ne range que l'EMPREINTE d'un code et cherche par elle, donc il ne compare
# rien. La bonne façon de tenir une comparaison en temps constant reste de ne pas
# avoir de comparaison à faire.
#
# Elle demeure dans le graphe, tirée par `ed25519-dalek`. Ce qui a disparu est
# notre appel, pas la crate.

ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }

# `sha2` POUR UN SEUL USAGE : l'empreinte d'un code d'enrôlement (`asl-auth`).
#
# Elle en avait deux ; le second était l'empreinte du certificat qui servait de
# liaison de canal. **Celle-là a disparu** : la liaison s'exporte désormais de la
# poignée de main (RFC 8446 §7.5), et `asl-cle` n'a plus rien à condenser.
#
# Elle est DÉJÀ dans le graphe — `ams-quic-crypto` la tire — et elle est en Rust
# pur.
sha2 = { version = "0.11", default-features = false }

# ── LA VÉRIFICATION D'UNE ATTESTATION APP ATTEST (`asl-apple`) ─────────────
#
# Toutes DÉJÀ dans le graphe, tirées par `rustls-rustcrypto` pour la pile TLS :
# les déclarer ici n'ajoute aucun paquet, et `check-pile` le mesure.
#
# `rustls-webpki` construit la chaîne jusqu'à la racine d'Apple et vérifie ses
# signatures. Il ne sait PAS signer ni vérifier lui-même : il délègue à des
# `SignatureVerificationAlgorithm` qu'on lui passe, et `rustls-rustcrypto` garde
# les siens privés. `asl-apple` écrit donc les quatre ECDSA dont une chaîne
# d'Apple a besoin, sur `p256` et `p384` — trente lignes, et aucune dépendance
# à `rustls` pour une crate qui ne parle pas TLS.
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
rustls-pki-types = { version = "1", default-features = false, features = ["alloc"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa"] }
signature = { version = "3", default-features = false }

# ── LA PILE QUIC ET HTTP/3, GREFFÉE DEPUIS `air-mail-server` (C15) ─────────
#
# Elles sont tirées par une dépendance `git` ÉPINGLÉE SUR UN COMMIT, jamais sur
# une branche. Une branche qui avance changerait le code compilé ici sans qu'une
# ligne de ce dépôt ait bougé, et un échec de CI ne dirait plus lequel des deux
# a changé.
#
# **Épinglage relevé le 2026-09-09 sur `1efd3bf`.** Le relever est une décision,
# et elle se prend en relisant ce qui a bougé en amont — pas en laissant cargo le
# faire.
#
# CE QUE CE RELÈVEMENT-CI APPORTE, ET POURQUOI IL A ÉTÉ DEMANDÉ
#
# `ams_quic_tls::Connection::export` — l'exportateur de RFC 8446 §7.5. C'est
# NOUS qui l'avons écrit là-bas, parce que C14 portait une réserve qu'aucune
# tranche d'ici ne pouvait lever : la liaison de canal était l'empreinte de notre
# certificat, faute d'exporteur, et un relais restait donc ouvert.
#
# L'amont a bougé d'un seul commit, et c'est celui-là. Rien d'autre n'a changé
# entre `3f18333` et `1efd3bf`.
#
# CE QUI EST REPRIS, ET CE QUI NE L'EST PAS
#
# `ams-loop-tokio` N'EST PAS REPRISE, et c'est la découverte de cette tranche.
# Elle porte la boucle du serveur de COURRIER : son `serve_quic` est générique,
# mais il est tissé avec `ams-guard`, son garde anti-abus, et avec sa notion de
# source. Nous écrivons donc NOTRE boucle, ici, dans `asl-loop-tokio`.
#
# `ams-quic-client` non plus, et pour une raison plus nette : **ce n'est pas une
# bibliothèque cliente, c'est un harnais d'essai.** Elle expose un `atelier()`
# qui crée un répertoire temporaire, un `materiel()` qui fabrique des
# certificats, des identifiants de connexion fixes, et une constante qui annonce
# qu'elle EXIGE openssl. Rien de cela n'a sa place dans un produit.
#
# Tout le reste est repris tel quel, et c'est possible parce que **rien de tout
# cela ne fait d'entrée-sortie** : `ams-quic` porte en tête de son manifeste
# « La machine de connexion QUIC, sans entrée-sortie ». C'est exactement ce qui
# rend une pile transplantable d'un dépôt à l'autre.
#
# CE QUE LA GREFFE COÛTE, MESURÉ ET NON ESTIMÉ (sonde du 2026-09-09)
#
# Dix crates `ams-*`, et le graphe passe de 30 à quelque 90 unités construites.
# Deux choses à savoir, parce qu'elles ne se voient pas dans cette liste :
#
#   — **Le fournisseur cryptographique de TLS est `rustls-rustcrypto 0.0.2-alpha`,
#     épinglé sur un rev git de RustCrypto.** C'est une dépendance `git` DANS une
#     dépendance `git` : `cargo audit` ne la voit pas, et c'est un pré-livrable
#     sous la couche TLS. `air-mail-server` l'a accepté ; nous en héritons. C'est
#     le prix du « aucune ligne de C » — les fournisseurs mûrs de `rustls` sont
#     `ring` et `aws-lc-rs`, et tous deux compilent du C.
#
#   — **`ring` est dans le RÉSOLU sans être construit.** `rustls` le déclare en
#     dépendance optionnelle ; nous ne l'activons pas. Il amène `cc` avec lui, et
#     c'est ce qui a obligé `check-sans-c.sh` à cesser de lire le résolu pour
#     lire le construit.
#
# `ed25519-dalek` EST PASSÉE EN 3 À CAUSE DE CETTE GREFFE, et il faut le dire :
# `rustls-rustcrypto` en tire la 3. Rester en 2 aurait mis DEUX implémentations
# d'Ed25519 dans le même binaire — celui-là même qu'un daemon tiers lie. Le
# passage n'a coûté aucune ligne de code : `asl-cle` n'emploie que
# `VerifyingKey`, `SigningKey`, `Signature`, `Signer` et `Verifier`.

ams-h3 = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "6f0ea51b6" }
ams-proto-h3 = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "6f0ea51b6" }
ams-proto-http = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "6f0ea51b6" }
ams-proto-quic = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "6f0ea51b6" }
ams-quic = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "6f0ea51b6" }
ams-quic-tls = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "6f0ea51b6" }

# `ams-tls` N'ENTRE QUE COMME DÉPENDANCE DE DÉVELOPPEMENT, et la nuance compte.
# Elle est DÉJÀ dans le graphe construit, tirée par `ams-quic-tls` ; ce qu'on
# déclare ici, c'est le droit de l'appeler NOUS-MÊMES depuis un essai — pour
# faire charger par notre propre pile le certificat que `scripts/ca.sh` frappe.
# Un certificat qu'openssl valide n'est qu'un certificat qu'openssl valide.
ams-tls = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "6f0ea51b6" }

# `ams-quic-client` EST UN HARNAIS D'ESSAI, PAS UNE BIBLIOTHÈQUE CLIENTE — voir
# `docs/transport.md` §3. Elle n'entre donc qu'en dépendance de DÉVELOPPEMENT,
# et c'est là qu'elle est irremplaçable : c'est un vrai client QUIC sur une
# vraie socket, et rien d'autre ne peut éprouver notre boucle de bout en bout.
ams-quic-client = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "6f0ea51b6" }

# `default-features = false` et la liste exacte d'`air-mail-server` : deux
# fournisseurs cryptographiques activés en même temps, c'est `rustls` qui refuse
# de choisir au démarrage.

# ── L'ENTREPÔT : `redb`, ET LE CHOIX EST MESURÉ ────────────────────────────
#
# `docs/contraintes.md` laissait la décision ouverte, avec la consigne « le jour
# où le magasin sera choisi, cette section devra dire lequel des deux a gagné, et
# pourquoi ». Voici le relevé qui a tranché, fait le 2026-09-09 :
#
#   | Candidat   | Unités construites | Suspects                        |
#   |------------|--------------------|---------------------------------|
#   | `redb`     | **2**              | aucun                           |
#   | `rusqlite` | 12                 | `libsqlite3-sys`, `pkg-config`  |
#   | `fjall`    | 42                 | `linux-raw-sys`                 |
#
# **`redb` ne tire que `libc`**, déjà dans le graphe et déjà admise par
# `check-sans-c.sh` avec sa raison écrite : ce sont des déclarations d'ABI, pas
# une ligne de C. Le coût NET est donc d'une unité.
#
# TROIS RAISONS, ET LA PREMIÈRE N'EST PAS LE NOMBRE
#
#   1. **`linux-air` arrive.** Tous les composants Rust auront une version
#      reposant sur la bibliothèque standard de `linux-air`. Une dépendance qui
#      lie du C devrait y être portée ; du Rust pur suit la toolchain.
#   2. **La barrière resterait rouge.** `check-sans-c.sh` porte sur le workspace
#      entier. SQLite y ferait entrer `libsqlite3-sys` et `pkg-config`, et il
#      faudrait soit désarmer le contrôle, soit lui ajouter une exception —
#      c'est-à-dire l'affaiblir là où il vient d'être renforcé.
#   3. **Le graphe.** C4 borne à 120 unités construites ; il en restait treize.
#
# CE QUE `redb` COÛTE EN ÉCHANGE, ET IL FAUT LE DIRE : **pas de SQL ad hoc, et
# aucun outil externe** pour ouvrir le fichier. Un administrateur qui veut
# regarder passe par notre code. C'est acceptable ici — les données sont peu
# nombreuses, les accès sont connus, et C13 fait qu'il n'y a presque rien à
# regarder.
redb = "4"

# Voir `asl-loop-tokio/src/privileges.rs` : un seul appel, `geteuid`.
libc = { version = "0.2", default-features = false }

rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Les longueurs et les numéros de port viennent du RÉSEAU. Un décodeur qui lit un
# port annoncé ne doit ni allouer, ni indexer, ni boucler sur cette valeur : il
# doit la REFUSER quand elle sort de ses bornes. Une conversion qui tronque ou qui
# perd un signe est ici une faille, pas une imprécision — d'où le `deny`.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
arithmetic_side_effects = "deny"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
